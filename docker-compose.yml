
volumes:
  mysql:
  backend-data:

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql}:${MYSQL_IMAGE_TAG:-9}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 3s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-start123}
    volumes:
      - mysql:/var/lib/mysql
    networks:
      dnpm:

  authup:
    image: ${AUTHUP_IMAGE:-authup/authup}:${AUTHUP_IMAGE_TAG:-1.0.0-beta.64}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command: start
    environment:
      - PUBLIC_URL=${BASE_URL}/auth/
      # Renamed from ADDITIONAL_DOMAINS. The portal runs the authorization-code
      # flow against Authup's built-in `admin-console` client, so its origin has
      # to be trusted for the redirect back to <portal-origin>/login/callback.
      - TRUSTED_ORIGINS=${BASE_URL}
      # Authup bundles its consoles and serves them under ${BASE_URL}/auth/console/*
      # (admin, account, auth). All three are enabled by default.
      - CLIENT_SYSTEM_ENABLED=true
      - CLIENT_SYSTEM_SECRET=${AUTHUP_SECRET:-start123}
      - CLIENT_SYSTEM_SECRET_RESET=true
      - DB_TYPE=mysql
      - DB_HOST=mysql
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-start123}
      - DB_DATABASE=auth
    networks:
      dnpm:

  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/dnpm-dip/portal}:${PORTAL_IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      - NUXT_API_URL=http://backend:9000/
      - NUXT_PUBLIC_API_URL=${BASE_URL}/api/
      - NUXT_AUTHUP_URL=http://authup:3000/
      - NUXT_PUBLIC_AUTHUP_URL=${BASE_URL}/auth/
      # Authup serves the account console under /console/* now; without this the
      # portal falls back to <NUXT_PUBLIC_AUTHUP_URL>/account, which 404s.
      - NUXT_PUBLIC_ACCOUNT_URL=${BASE_URL}/auth/console/account
    networks:
      dnpm:

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dnpm-dip/api-gateway}:${BACKEND_IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      - LOCAL_SITE=${BACKEND_LOCAL_SITE}   # Format: {Site-ID}:{Site-name}, e.g. UKT:Tübingen
      - RD_RANDOM_DATA=${BACKEND_RD_RANDOM_DATA:--1}
      - MTB_RANDOM_DATA=${BACKEND_MTB_RANDOM_DATA:--1}
      - HATEOAS_HOST=${BASE_URL}/api
      - CONNECTOR_TYPE=${BACKEND_CONNECTOR_TYPE:-broker}
      - AUTHUP_URL=client://system:${AUTHUP_SECRET:-start123}@http://authup:3000
      - HGNC_GENESET_URL=${BACKEND_HGNC_GENESET_URL:-https://storage.googleapis.com/public-download-files/hgnc/json/json/hgnc_complete_set.json}  # Default: Official URL (Source: https://genenames.org/download/)
      - TZ=${LOCAL_TIMEZONE:-Europe/Berlin}
      - ACTIVE_FEDERATED_QUERY_USE_CASES=${BACKEND_FEDERATED_QUERY_USE_CASES:-}
    volumes:
      - './backend-config:/dnpm_config'
      - backend-data:/dnpm_data
    depends_on:
      authup:
        condition: service_healthy
    networks:
      dnpm:

  nginx:
    image: ${NGINX_IMAGE:-nginxproxy/nginx-proxy}:${NGINX_IMAGE_TAG:-alpine}
    ports:
      - ${HTTPS_PORT:-443}:443
      - ${HTTP_PORT:-80}:80
    volumes:
      - '/var/run/docker.sock:/tmp/docker.sock:ro'
      - './certs:/etc/ssl/certs'
      - './nginx/nginx.conf:/etc/nginx/nginx.conf'
      - './nginx/sites-enabled:/etc/nginx/sites-enabled'
    depends_on:
      authup:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      dnpm:

  polling_module:
    image: ${POLLING_MODULE_IMAGE:-ghcr.io/dnpm-dip/http-polling-module}:${POLLING_MODULE_IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    profiles: [polling]
    volumes:
      - './polling-config/config.properties:/opt/config.properties'
    depends_on:
      nginx:
        condition: service_started
    networks:
      dnpm:

networks:
  dnpm:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ${NETWORK_NAME:-dnpm}
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK_SUBNET:-172.50.1.0/24}
